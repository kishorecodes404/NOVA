[pytest]
markers =
    routing: routing-decision tests (route_query)
    agent: single-agent outcome tests
    a2a: agent-to-agent / cross-system tests (PLAN, AUTO_EXECUTE)
    edge_case: ambiguous / invalid / boundary input tests
    failure: failure-injection tests (timeout, unavailable, invalid data, permission)
    regression: stable subset run on every change (CI gate)
    live: hits a real local Ollama instance - skipped by default
    slow: slower tests (e.g. many parametrized cases)

filterwarnings =
    ignore::DeprecationWarning

# Keep Streamlit's "bare mode" runtime noise out of test output -
# app.py/rag.py are written to run inside `streamlit run`, but the
# functions under test (route_query, validate_*, apply_*, search_*)
# don't need a real Streamlit script run, just a bare import.
addopts = -p no:cacheprovider